[project]
name = "tfm2526-examenescomprensionlectora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "langgraph>=0.4.5",
    "langchain-google-genai>=2.1.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pillow>=11.2.1",
    "pydantic>=2.11.4",
    "requests>=2.32.3",
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["matching_agents"]

[project.scripts]
run-matching-agents = "matching_agents.run_matching:main"
calculate-accuracy = "matching_agents.calculate_accuracy:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
